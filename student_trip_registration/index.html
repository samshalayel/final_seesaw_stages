<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة مدرسية - تسجيل الطلاب</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>الرحلة المدرسية</h1>
        <nav>
            <ul>
                <li><a href="index.html">التسجيل</a></li>
                <li><a href="schedule.html">جدول الرحلة</a></li>
                <li><a href="fees.html">تحصيل الرسوم</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="registration">
            <h2>تسجيل الطلاب</h2>
            <form>
                <label for="student-name">اسم الطالب:</label>
                <input type="text" id="student-name" name="student-name" required>
                <label for="student-age">العمر:</label>
                <input type="number" id="student-age" name="student-age" required>
                <label for="parent-contact">وسيلة الاتصال بولي الأمر:</label>
                <input type="text" id="parent-contact" name="parent-contact" required>
                <button type="submit">تسجيل</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2023 المدرسة</p>
    </footer>
</body>
</html>
