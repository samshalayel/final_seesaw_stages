<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Trip Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>تسجيل الطلاب للرحلة المدرسية</h1>
        <form>
            <label for="student-name">اسم الطالب:</label>
            <input type="text" id="student-name" name="student-name" required>

            <label for="grade">الصف:</label>
            <input type="text" id="grade" name="grade" required>

            <input type="submit" value="تسجيل">
        </form>
    </div>
    <div class="trip-schedule">
        <h2>جدول الرحلة</h2>
        <ul>
            <li>الوصول إلى المتحف - 10:00 صباحًا</li>
            <li>جولة بالمدينة - 12:00 ظهرًا</li>
            <li>الغداء في الحديقة - 2:00 مساءً</li>
            <li>العودة إلى المدرسة - 4:00 مساءً</li>
        </ul>
    </div>
    <div class="fees">
        <h2>تحصيل الرسوم</h2>
        <p>تكلفة الرحلة: 50 جنيه</p>
    </div>
</body>
</html>
